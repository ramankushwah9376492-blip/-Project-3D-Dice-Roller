<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Dice Roller</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at top, #283593, transparent 45%),
        #070812;
    color: white;
    overflow: hidden;
}

.container {
    width: 92%;
    max-width: 380px;
    padding: 30px 20px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(18px);
    box-shadow: 0 25px 70px rgba(0,0,0,.5);
}

h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 35px;
}

.scene {
    width: 130px;
    height: 130px;
    margin: 0 auto 35px;
    perspective: 600px;
}

.dice {
    width: 110px;
    height: 110px;
    margin: 10px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.2,.8,.2,1);
}

.face {
    position: absolute;
    width: 110px;
    height: 110px;
    border-radius: 20px;
    background: linear-gradient(145deg, #ffffff, #d7d7d7);
    border: 3px solid #aaa;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 42px;
    color: #111;
    box-shadow: inset 0 0 20px rgba(0,0,0,.1);
}

.front  { transform: translateZ(55px); }
.back   { transform: rotateY(180deg) translateZ(55px); }
.right  { transform: rotateY(90deg) translateZ(55px); }
.left   { transform: rotateY(-90deg) translateZ(55px); }
.top    { transform: rotateX(90deg) translateZ(55px); }
.bottom { transform: rotateX(-90deg) translateZ(55px); }

.result {
    font-size: 20px;
    margin-bottom: 12px;
}

.result span {
    color: #64ffda;
    font-size: 34px;
    font-weight: bold;
}

.roll-count {
    color: #999;
    font-size: 14px;
    margin-bottom: 25px;
}

button {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, #00e5ff, #7c4dff);
    color: white;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 10px 25px rgba(0,229,255,.2);
    cursor: pointer;
}

button:active {
    transform: scale(.96);
}
</style>
</head>

<body>

<div class="container">

    <h1>🎲 3D DICE</h1>

    <div class="subtitle">
        Tap the button and roll your dice
    </div>

    <div class="scene">

        <div class="dice" id="dice">

            <div class="face front">1</div>
            <div class="face back">6</div>
            <div class="face right">3</div>
            <div class="face left">4</div>
            <div class="face top">5</div>
            <div class="face bottom">2</div>

        </div>

    </div>

    <div class="result">
        Result: <span id="result">1</span>
    </div>

    <div class="roll-count">
        Rolls: <span id="rolls">0</span>
    </div>

    <button onclick="rollDice()">
        🎲 ROLL DICE
    </button>

</div>

<script>

const dice = document.getElementById("dice");
const result = document.getElementById("result");
const rolls = document.getElementById("rolls");

let rollCount = 0;

const rotations = {
    1: "rotateX(0deg) rotateY(0deg)",
    2: "rotateX(90deg) rotateY(0deg)",
    3: "rotateY(-90deg)",
    4: "rotateY(90deg)",
    5: "rotateX(-90deg)",
    6: "rotateX(180deg)"
};

function rollDice() {

    const number = Math.floor(Math.random() * 6) + 1;

    rollCount++;

    result.textContent = number;
    rolls.textContent = rollCount;

    const extraX = 360 * (Math.floor(Math.random() * 3) + 2);
    const extraY = 360 * (Math.floor(Math.random() * 3) + 2);

    dice.style.transform =
        `rotateX(${extraX}deg) rotateY(${extraY}deg)`;

    setTimeout(() => {

        dice.style.transform = rotations[number];

    }, 700);
}

</script>

</body>
</html>
